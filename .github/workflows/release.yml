name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("fs"); const version = require("./package.json").version; if ("v" + version !== process.env.RELEASE_TAG) throw new Error("Release tag must match package.json version"); fs.accessSync("docs/releases/" + process.env.RELEASE_TAG + ".md");'

      - name: Test playback and backend behavior
        run: |
          pnpm test
          pnpm run test:backend

      - name: Check application types
        run: pnpm exec tsc --noEmit --skipLibCheck

      - name: Build frontend
        run: pnpm run build

      - name: Download yt-dlp binary
        run: |
          mkdir -p bin
          curl --fail --location -o bin/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp"
          echo "1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  bin/yt-dlp" | sha256sum --check
          chmod +x bin/yt-dlp

      - name: Package plugin
        run: |
          mkdir -p "DeckTunes"
          cp main.py "./DeckTunes/"
          cp plugin.json "./DeckTunes/"
          cp package.json "./DeckTunes/"
          cp LICENSE "./DeckTunes/"
          cp README.md "./DeckTunes/"
          cp CHANGELOG.md "./DeckTunes/"
          cp -r docs "./DeckTunes/"
          cp -r dist "./DeckTunes/"
          cp -r bin "./DeckTunes/"
          [ -d "assets" ] && cp -r assets "./DeckTunes/" || true
          [ -d "defaults" ] && cp -r defaults "./DeckTunes/" || true
          mkdir -p out
          zip -r out/DeckTunes.zip DeckTunes
          cd out
          sha256sum DeckTunes.zip > DeckTunes.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckTunes
          path: |
            out/DeckTunes.zip
            out/DeckTunes.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DeckTunes
          path: out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            out/DeckTunes.zip
            out/DeckTunes.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
